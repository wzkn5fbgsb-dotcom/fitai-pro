# Compila la app en los servidores de Expo (EAS Build) sin necesidad de computadora.
# Se lanza a mano: GitHub → Actions → "EAS build" → Run workflow.
#
# Secrets necesarios (GitHub → Settings → Secrets and variables → Actions):
#   EXPO_TOKEN            token de expo.dev (Account settings → Access tokens)
#   EAS_PROJECT_ID        Project ID del proyecto en expo.dev
# Sólo para iOS (clave de la API de App Store Connect, para crear certificados sin preguntas):
#   EXPO_ASC_API_KEY_P8   contenido del archivo .p8 codificado en base64
#   EXPO_ASC_KEY_ID       Key ID de esa clave
#   EXPO_ASC_ISSUER_ID    Issuer ID (App Store Connect → Users and Access → Integrations)
#   EXPO_APPLE_TEAM_ID    Team ID de tu cuenta de Apple Developer
#
# Las variables EXPO_PUBLIC_* de la app NO se toman de aquí: se configuran en
# expo.dev → proyecto → Environment variables (entornos "preview" y "production").
name: EAS build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Plataforma
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: Perfil (preview = pruebas internas, production = tiendas)
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Comprobar secretos
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then echo "::error::Falta el secret EXPO_TOKEN"; exit 1; fi
          if [ -z "$EAS_PROJECT_ID" ]; then echo "::error::Falta el secret EAS_PROJECT_ID"; exit 1; fi
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - name: Clave de App Store Connect (sólo iOS)
        if: inputs.platform != 'android'
        env:
          P8: ${{ secrets.EXPO_ASC_API_KEY_P8 }}
        run: |
          if [ -z "$P8" ]; then echo "::error::Falta el secret EXPO_ASC_API_KEY_P8 para compilar iOS"; exit 1; fi
          echo "$P8" | base64 -d > "$RUNNER_TEMP/asc_api_key.p8"
          echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/asc_api_key.p8" >> "$GITHUB_ENV"
      - name: Lanzar la compilación
        env:
          EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
          EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
      - name: Dónde ver el resultado
        run: echo "La compilación sigue en expo.dev → proyecto fitai-pro → Builds (tarda ~15-30 min)."
