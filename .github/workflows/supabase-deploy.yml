# Sube la base de datos y las funciones del servidor a tu proyecto de Supabase.
# Se lanza a mano: GitHub → Actions → "Supabase deploy" → Run workflow.
#
# Secrets necesarios:
#   SUPABASE_ACCESS_TOKEN   supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_REF    el id del proyecto (aparece en la URL: supabase.com/dashboard/project/<ref>)
#   SUPABASE_DB_PASSWORD    contraseña de la base de datos (la que pusiste al crear el proyecto)
#   SUPABASE_DB_URL         cadena de conexión (Project → Connect → "Session pooler"), con la contraseña
#   ANTHROPIC_API_KEY, AI_MODEL, AI_PRICE_IN_PER_MTOK, AI_PRICE_OUT_PER_MTOK, REVENUECAT_WEBHOOK_AUTH
#     (ver supabase/.env.example; los vacíos se omiten)
name: Supabase deploy

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Cargar/actualizar el catálogo (alimentos, recetas, ejercicios)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vincular el proyecto
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Aplicar migraciones (tablas y permisos)
        run: supabase db push
      - name: Cargar el catálogo (seed)
        if: inputs.seed
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Falta el secret SUPABASE_DB_URL"; exit 1; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: Secretos de las funciones
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_PRICE_IN_PER_MTOK: ${{ secrets.AI_PRICE_IN_PER_MTOK }}
          AI_PRICE_OUT_PER_MTOK: ${{ secrets.AI_PRICE_OUT_PER_MTOK }}
          REVENUECAT_WEBHOOK_AUTH: ${{ secrets.REVENUECAT_WEBHOOK_AUTH }}
        run: |
          args=()
          for k in ANTHROPIC_API_KEY AI_MODEL AI_PRICE_IN_PER_MTOK AI_PRICE_OUT_PER_MTOK REVENUECAT_WEBHOOK_AUTH; do
            v="${!k}"
            if [ -n "$v" ]; then args+=("$k=$v"); else echo "::warning::Secret $k vacío: no se cambia"; fi
          done
          if [ ${#args[@]} -gt 0 ]; then supabase secrets set "${args[@]}"; fi
      - name: Desplegar funciones
        run: |
          supabase functions deploy ai-coach nutrition-plan delete-account
          supabase functions deploy revenuecat-webhook --no-verify-jwt
